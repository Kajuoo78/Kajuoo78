<!DOCTYPE html>
<html>
<head>
    <title>Ottoman Water Solutions</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        .hero-bg {
            /* This line makes the image your background */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url("showroom.jpg");
            height: 100vh;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            border-top: 10px solid #b22222; /* Red accent */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h1 { color: #b22222; margin-top: 0; font-size: 2.2rem; text-transform: uppercase; }
        p { color: #333; font-size: 1.1rem; font-weight: 500; }
        .btn {
            background: #b22222;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hero-bg">
        <div class="content-box">
            <h1>Ottoman Water Solutions</h1>
            <p>Suppliers in plumbing and general construction supplies.</p>
            <a href="mailto:contact@example.com" class="btn">Get a Quote</a>
        </div>
    </div>

</body>
</html>
